[package]
name = "noctalia-core"
description = "Foundations: logging, files, atomic writes, timers, event loop (calloop + tokio sidecar), process, i18n, time."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
calloop = "0.14.4"
jiff = "0.2.35"
libc = "0.2.189"
rand = "0.9.2"
serde_json = "1.0.150"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
