[package]
name = "noctalia-theme"
description = "Color/palette/M3 scheme engine, template engine, theme image loading, app-theme outputs."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
image = "0.25"
material-colors = "0.4"
noctalia-config = { path = "../noctalia-config" }
noctalia-core = { path = "../noctalia-core" }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "0.9.12"
